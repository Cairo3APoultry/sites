<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairo 3A — Sites Directory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A47;--red:#C4151C;--ink:#1F2937;--ink2:#5B6676;--gray:#94A3B8;--line:#E4E9F1;--bg:#F3F5F9;--card:#FFFFFF;
  --soft:#F7F9FC;--amber:#FFF7E6;--amber-b:#F5D9A8;--amber-t:#8A5A00;--ok:#15803D;--wa:#16A34A;--font:'Cairo','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#E8EDF4;--ink2:#A9B4C6;--gray:#7E8AA0;--line:#2A3547;--bg:#0E1420;--card:#172033;
  --soft:#1C273B;--amber:#2B2416;--amber-b:#5C4A22;--amber-t:#F2C979}}
html[lang="en"]{--font:'Inter','Cairo',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}

.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-bottom:4px solid var(--red)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .fb{font-family:Georgia,serif;font-weight:700;font-size:19px}
.lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700}
.top h1{max-width:980px;margin:14px auto 0;font-size:21px;font-weight:800;line-height:1.3}
.top p{max-width:980px;margin:4px auto 0;font-size:13px;color:#B9C6DA}

.wrap{max-width:980px;margin:0 auto;padding:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  font:inherit;font-size:16px;padding:0 42px 0 14px;outline:none}
html[dir="ltr"] .search input{padding:0 14px 0 42px}
.search input:focus{border-color:var(--red)}
.search i{position:absolute;top:50%;transform:translateY(-50%);right:14px;color:var(--gray)}
html[dir="ltr"] .search i{right:auto;left:14px}
.near{height:46px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:0 16px;display:flex;align-items:center;gap:7px}
.near.on{background:var(--red)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

#map{height:240px;border-radius:14px;margin:10px 0 4px;border:1px solid var(--line);z-index:1;background:var(--soft)}
.map-toggle{background:none;border:none;color:var(--ink2);font-size:13px;font-weight:700;padding:6px 2px}
.count{font-size:13px;color:var(--gray);margin:8px 2px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 4px 18px -12px rgba(20,30,50,.25)}
.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.c-co{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--red);text-transform:uppercase}
.c-name{font-size:18px;font-weight:800;line-height:1.3;margin-top:2px}
.c-dist{flex-shrink:0;background:var(--soft);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px}
.act{height:46px;border-radius:11px;border:none;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.act.nav{background:var(--red);color:#fff}
.act.call{background:var(--navy);color:#fff}
.act.wa{background:var(--wa);color:#fff}
.act.off{background:var(--soft);color:var(--gray);pointer-events:none}
.box{border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.box b{display:block;font-size:11px;letter-spacing:.4px;margin-bottom:2px}
.box.rcv{background:var(--amber);border:1px solid var(--amber-b);color:var(--ink)}
.box.rcv b{color:var(--amber-t)}
.box.note{background:var(--soft);color:var(--ink)}
.box.note b{color:var(--ink2)}
.c-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2);gap:8px;flex-wrap:wrap}
.c-foot .who{display:flex;align-items:center;gap:6px;font-weight:700}
.nolo{font-size:12.5px;color:var(--gray);display:flex;align-items:center;gap:6px}
.copy{background:none;border:none;color:var(--ink2);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}

.state{text-align:center;padding:60px 20px;color:var(--ink2)}
.state i{font-size:40px;color:var(--gray);display:block;margin-bottom:10px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--card);
  padding:11px 16px;border-radius:11px;font-size:13.5px;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--gray);padding:22px 0 8px}
.leaflet-popup-content{font-family:var(--font);font-size:13px}
.leaflet-popup-content a{color:#C4151C;font-weight:800}

 
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{border:none;background:none;padding:9px;border-radius:10px;font-size:14px;font-weight:800;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(20,30,50,.14)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.g{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 22px -14px rgba(20,30,50,.35)}
.gh{display:flex;gap:12px;align-items:center;padding:14px 14px 12px}
.av{width:48px;height:48px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0;position:relative;box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--line)}
.av i{position:absolute;bottom:-3px;inset-inline-start:-3px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;border:2px solid var(--card);border-radius:10px;padding:0 5px;line-height:16px}
.gn{min-width:0;flex:1}.gn b{display:block;font-size:16.5px;font-weight:800;line-height:1.3}.gn small{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.ga{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 14px 12px}
.ga.three{grid-template-columns:1fr 1fr 1.3fr}
.sl{border-top:1px solid var(--line)}
.st{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.st:last-child{border-bottom:none}
.st.op{background:var(--soft)}
.pin{width:32px;height:32px;border-radius:9px;background:rgba(196,21,28,.1);color:var(--red);display:grid;place-items:center;font-size:15px;flex-shrink:0}
.sn{flex:1;min-width:0}.sn b{display:block;font-size:14.5px;font-weight:800;line-height:1.35}
.sn small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);margin-top:2px}
.tg{font-size:10.5px;font-weight:800;color:var(--amber-t);background:var(--amber);border:1px solid var(--amber-b);border-radius:6px;padding:0 6px}
.dk{font-size:11.5px;font-weight:800;color:var(--ink2);background:var(--soft);border-radius:7px;padding:3px 7px;white-space:nowrap}
.go{flex-shrink:0;background:var(--red);color:#fff;border-radius:10px;font-size:12.5px;font-weight:800;padding:8px 11px;text-decoration:none;display:flex;align-items:center;gap:5px}
.go.off{background:var(--soft);color:var(--gray);pointer-events:none}
.sx{display:none;padding:0 14px 12px;flex-direction:column;gap:8px;background:var(--soft)}
.st.op+.sx{display:flex}
.sx .copy{align-self:flex-start}
.gx{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.oh{grid-column:1/-1;font-size:12.5px;font-weight:800;color:var(--ink2);margin:6px 2px 0;display:flex;align-items:center;gap:6px}

 
.nb{border:1.5px solid var(--line);border-radius:13px;background:var(--card);padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.nb-h{display:flex;align-items:center;gap:10px}
.nb-ic{width:36px;height:36px;border-radius:10px;background:rgba(27,42,71,.08);color:var(--navy);display:grid;place-items:center;font-size:17px;flex-shrink:0}
@media (prefers-color-scheme:dark){.nb-ic{background:rgba(148,163,184,.14);color:#C9D4E5}}
.nb-t{flex:1;min-width:0}.nb-t b{display:block;font-size:14px;font-weight:800}.nb-t small{font-size:12px;color:var(--ink2);font-weight:700;font-family:Inter,var(--font)}
.pill{font-size:11.5px;font-weight:800;border-radius:20px;padding:3px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.none{background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
.pill.partial{background:var(--amber);color:var(--amber-t);border:1px solid var(--amber-b)}
.pill.done{background:rgba(21,128,61,.12);color:var(--ok);border:1px solid rgba(21,128,61,.3)}
@media (prefers-color-scheme:dark){.pill.done{color:#4ADE80}}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber-t);border-radius:6px}
.bar.done i{background:var(--ok)}
.nb-a{display:grid;grid-template-columns:1fr 1.25fr;gap:7px}
.btn2{height:42px;border-radius:11px;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--navy);background:var(--card);color:var(--navy)}
@media (prefers-color-scheme:dark){.btn2{border-color:#4A5B7A;color:var(--ink)}}
.btn1{height:42px;border-radius:11px;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:var(--red);color:#fff}
.btn1:disabled{background:var(--soft);color:var(--gray)}
.btn1.ok:disabled{background:rgba(21,128,61,.12);color:var(--ok)}
.hello{max-width:980px;margin:10px auto 0;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px 12px}
.hello i{color:#ff8a8e;font-size:17px}
.mine{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px;box-shadow:0 4px 18px -12px rgba(20,30,50,.25)}
.mine .mi{width:38px;height:38px;border-radius:11px;background:rgba(196,21,28,.1);color:var(--red);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.mine .mt{flex:1;min-width:0}.mine .mt b{display:block;font-size:14.5px;font-weight:800}.mine .mt small{font-size:12px;color:var(--ink2);font-weight:700}
.mine button{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;font-weight:800;font-size:12.5px;padding:8px 10px;white-space:nowrap}
.mine button.on{background:var(--red);border-color:var(--red);color:#fff}
.nbs{display:flex;flex-direction:column;gap:8px}
.tg2{font-size:10.5px;font-weight:800;border-radius:6px;padding:0 6px;display:inline-flex;align-items:center;gap:3px}
.tg2.none{background:rgba(196,21,28,.1);color:var(--red)}.tg2.partial{background:var(--amber);color:var(--amber-t)}.tg2.done{background:rgba(21,128,61,.12);color:var(--ok)}

.ov{position:fixed;inset:0;background:rgba(8,12,22,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .22s ease-out}
@media(min-width:800px){.ov{align-items:center}.sheet{border-radius:20px;height:90vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--navy);color:#fff;border-bottom:3px solid var(--red)}
.sh-h div{flex:1;min-width:0}.sh-h small{display:block;font-size:12px;color:#B9C6DA;font-weight:700}.sh-h b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.x{width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.sh-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-b>*{flex-shrink:0}    
.sh-f{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px}
.sh-f>*{flex:1}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sum-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px}
.sum-h b{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
summary.sum-h{cursor:pointer;list-style:none}summary.sum-h::-webkit-details-marker{display:none}
details.sum .sum-h i{transition:.2s;font-size:12px}details.sum[open] .sum-h i{transform:rotate(180deg)}
.sum table{width:100%;border-collapse:collapse;font-size:13px}
.sum th{font-size:11px;color:var(--ink2);font-weight:800;padding:7px 10px;background:var(--soft);text-align:start}
.sum td{padding:8px 10px;border-top:1px solid var(--line);font-weight:700}
.sum td.n,.sum th.n{text-align:center;font-family:Inter,var(--font);white-space:nowrap}
.sum td.rem{color:var(--red)}.sum td.zero{color:var(--ok)}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;direction:ltr;position:relative;min-height:120px}
.doc iframe{border:0;width:860px;display:block;transform-origin:0 0;background:#fff;pointer-events:none}
.doc-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.doc-bar span{font-size:12.5px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:6px}
.doc-bar .mx{height:34px;display:flex;align-items:center;gap:5px}
.doc .spin{position:absolute;top:40px;left:50%;margin-left:-17px}
.sec{font-size:12.5px;font-weight:800;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-top:2px}
.ln{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.ln.bad{border-color:var(--red)}.ln.full{opacity:.55}
.ln-n b{display:block;font-size:14.5px;font-weight:800}.ln-n small{font-size:12px;color:var(--ink2);font-weight:700}
.ln-q{display:flex;gap:6px;align-items:center}
.ln-q input{width:96px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:inherit;font-size:16px;font-weight:800;outline:none}
.ln-q input:focus{border-color:var(--red)}
.mx{height:44px;border:none;border-radius:10px;background:var(--soft);color:var(--ink);font-weight:800;font-size:12.5px;padding:0 10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;font-weight:800;color:var(--ink2)}
.fld input{height:46px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;outline:none}
.fld input:focus{border-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.ph{border:2px dashed var(--line);border-radius:14px;background:var(--card);padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--ink2)}
.ph i{font-size:30px;color:var(--red)}.ph b{color:var(--ink);font-size:14.5px}.ph small{font-size:12px}
.ph.bad{border-color:var(--red)}
.ph-ok{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid rgba(21,128,61,.35);border-radius:14px;padding:10px}
.ph-ok img{width:76px;height:96px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.ph-ok div{flex:1}.ph-ok b{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:13.5px}
.err{background:rgba(196,21,28,.09);border:1px solid rgba(196,21,28,.35);color:var(--red);border-radius:11px;padding:10px 12px;font-size:13.5px;font-weight:700}
.rv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rv-r{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}.rv-r span{color:var(--ink2)}
.rv-r b{font-family:Inter,var(--font);white-space:nowrap}
.done-v{text-align:center;padding:24px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.done-v .ck{width:74px;height:74px;border-radius:50%;background:rgba(21,128,61,.12);color:var(--ok);display:grid;place-items:center;font-size:38px}
.done-v b{font-size:19px}.done-v p{color:var(--ink2);font-size:14px;max-width:420px}
.hist{font-size:12.5px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.8}
.hist b{color:var(--ink)}
.hist-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.ntc{border-radius:14px;padding:12px 13px;display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.65}
.ntc>i{font-size:20px;line-height:1.2;flex-shrink:0}
.ntc b{display:block;font-size:14px}
.ntc .why{display:block;margin-top:3px;font-weight:700}
.ntc.red{background:rgba(196,21,28,.08);border:1.5px solid rgba(196,21,28,.35);color:var(--ink)}.ntc.red>i{color:var(--red)}
.ntc.amb{background:var(--amber);border:1px solid var(--amber-b);color:var(--ink)}.ntc.amb>i{color:var(--amber-t)}
.ntc .btn1{height:38px;margin-top:8px;padding:0 14px;display:inline-flex}
.pill.fix{background:rgba(196,21,28,.1);color:var(--red);border:1px solid rgba(196,21,28,.3)}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.mini td{padding:5px 2px;border-top:1px dashed var(--line)}.mini td.n{text-align:end;font-weight:800;white-space:nowrap;font-family:Inter,var(--font)}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand" id="brand"><span class="fb">CAIRO 3A</span></div>
    <button class="lang" id="langBtn" onclick="toggleLang()">English</button>
  </div>
  <h1 data-t="title">دليل مواقع القطاعات</h1>
  <p data-t="sub">الموقع، والتواصل، وتعليمات الاستلام لكل قطاع</p>

var LANG = (function(){ try { return localStorage.getItem('SD_LANG') || 'ar'; } catch(e){ return 'ar'; } })();
var DATA = [], CONTACTS = [], CO = '', ME = null, MAP = null, LAYER = null, MAP_ON = true;
var MODE = (function(){ try { return localStorage.getItem('SD_MODE') || 'people'; } catch(e){ return 'people'; } })();
var AV = ['#1B2A47','#3D5A8C','#6B84B0','#7C3A2E','#2F6B5E','#5B4B8A'];
function t(k){ return T[LANG][k]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function toast(m){ var e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('show');},2600); }

function applyLang(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(k!=='hideMap') el.textContent=t(k); });
  document.querySelectorAll('[data-tp]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-tp')); });
  document.getElementById('langBtn').textContent=t('lang');
  document.querySelector('#mapToggle span').textContent=MAP_ON?t('hideMap'):t('showMap');
}
function toggleLang(){ LANG=LANG==='ar'?'en':'ar'; try{localStorage.setItem('SD_LANG',LANG);}catch(e){} applyLang(); renderChips(); renderMine(); render(); }

 
function waNum(p){ var d=String(p||'').replace(/[^\d]/g,''); if(d.indexOf('00')===0)d=d.slice(2);
  if(d.length===11&&d[0]==='0')d='20'+d.slice(1); else if(d.length===10&&d[0]==='1')d='20'+d; return d; }
function dist(a,b,c,d){ var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)); }
function hasLoc(r){ return r.lat!==null&&r.lng!==null&&isFinite(r.lat)&&isFinite(r.lng); }

function fetchList(ok, bad){
  if(window.google&&google.script&&google.script.run){
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(bad||function(){});
    if(VTOK) r.sd_vendor(VTOK); else r.sd_public(KEY);
  } else if(GAS_URL){
    fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(VTOK?{action:'sectorVendor',payload:{v:VTOK}}:{action:'sectorDirectory',payload:{key:KEY}})})
      .then(function(r){return r.json();}).then(ok).catch(bad||function(){});
  } else if(bad) bad();
}
function load(){
  if(!KEY&&!VTOK){ fail('invalid'); return; }
  fetchList(got, function(){ fail('failed'); });
}
function got(res){
  if(!res||!res.ok){ fail('invalid'); return; }
  DATA=res.rows||[]; CONTACTS=res.contacts||[]; groupKeys();
  VENDOR=res.vendor||null; renderMine();
  if(res.brand&&res.brand.logo) document.getElementById('brand').innerHTML='<img src="'+res.brand.logo+'" alt="Cairo 3A">';
  document.getElementById('foot').textContent='Cairo 3A Poultry';
  renderChips(); render(); if(!MAP) initMap(); else drawMarkers(view());
}
function fail(k){
  document.getElementById('list').innerHTML='<div class="state" style="grid-column:1/-1"><i class="bi bi-'+(k==='invalid'?'shield-lock':'wifi-off')+'"></i>'+esc(t(k))+'</div>';
  document.getElementById('map').style.display='none'; document.getElementById('mapToggle').style.display='none';
}

function renderChips(){
  var el=document.getElementById('chips'); el.innerHTML=''; return;    
  var cos=[];
  el.innerHTML=[''].concat(cos).map(function(c){
     
    return '<button class="chip'+(c===CO?' on':'')+'" data-c="'+esc(c)+'" onclick="setCo(this.getAttribute(\'data-c\'))">'+esc(c||t('all'))+'</button>';
  }).join('');
}
function setCo(c){ CO=c; renderChips(); render(); }

function view(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var rows=DATA.filter(function(r){
    var g=grp(r);
    if(ONLY&&!(r.pos&&r.pos.length)) return false;
    return !q||((r.name||'')+' '+(g?g.name+' '+g.title:'')).toLowerCase().indexOf(q)>=0;    
  });
  if(ME) rows=rows.map(function(r){ r._d=hasLoc(r)?dist(ME.lat,ME.lng,r.lat,r.lng):Infinity; return r; })
                  .sort(function(a,b){ return a._d-b._d; });
  return rows;
}
function render(){
  var rows=view(), L=document.getElementById('list');
  window._ROWS=rows;
  document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-m')===MODE); });
  if(!rows.length){ document.getElementById('count').textContent=t('count')(0);
    L.className='list'; L.innerHTML='<div class="state" style="grid-column:1/-1"><i class="bi bi-search"></i>'+t('none')+'</div>'; drawMarkers(rows); return; }
  if(MODE==='people'&&HAS_GROUPS){ renderPeople(rows); drawMarkers(rows); return; }
  document.getElementById('count').textContent=t('count')(rows.length);
  L.className='list';
  L.innerHTML=rows.map(siteCard).join('');
  drawMarkers(rows);
}
function siteCard(r,i){
  {
    var loc=hasLoc(r), dest=loc?(r.lat+','+r.lng):'';
    var navUrl=loc?'https://www.google.com/maps/dir/?api=1&destination='+dest:(r.mapUrl||'');
    var ph=String(r.adminPhone||'').replace(/[^\d+]/g,''), wa=waNum(r.adminPhone);
    var label=r.name;
    return '<article class="card">'
      +'<div class="c-head"><div class="c-name">'+esc(r.name)+'</div>'
      +(ME&&isFinite(r._d)?'<span class="c-dist"><i class="bi bi-geo-alt"></i> '+(r._d<10?r._d.toFixed(1):Math.round(r._d))+t('km')+'</span>':'')+'</div>'
      +'<div class="acts">'
      +(navUrl?'<a class="act nav" href="'+esc(navUrl)+'" target="_blank" rel="noopener"><i class="bi bi-sign-turn-right-fill"></i>'+t('nav')+'</a>'
              :'<span class="act off"><i class="bi bi-geo"></i>'+t('nav')+'</span>')
      +(ph?'<a class="act call" href="tel:'+esc(ph)+'"><i class="bi bi-telephone-fill"></i>'+t('call')+'</a>':'<span class="act off"><i class="bi bi-telephone"></i>'+t('call')+'</span>')
      +(wa?'<a class="act wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent(t('waMsg')(label))+'" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>'+t('wa')+'</a>'
          :'<span class="act off"><i class="bi bi-whatsapp"></i>'+t('wa')+'</span>')
      +'</div>'
      +noteBar(r,i)
      +(r.receiving?'<div class="box rcv"><b><i class="bi bi-truck"></i> '+t('rcv')+'</b>'+esc(r.receiving)+'</div>':'')
      +(r.notes?'<div class="box note"><b><i class="bi bi-info-circle"></i> '+t('note')+'</b>'+esc(r.notes)+'</div>':'')
      +'<div class="c-foot">'
      +(r.adminName?'<span class="who"><i class="bi bi-person-badge"></i>'+t('admin')+': '+esc(r.adminName)+'</span>':'<span></span>')
      +(loc?'<button class="copy" onclick="copyLoc('+i+')"><i class="bi bi-clipboard"></i>'+t('copy')+'</button>'
           :'<span class="nolo"><i class="bi bi-geo"></i>'+t('noLoc')+'</span>')
      +'</div></article>';
  }
}


var GROUPS = {}, HAS_GROUPS = false;
function digits(p){ return waNum(p); }
function groupKeys(){
  GROUPS = {};
  DATA.forEach(function(r){
    var k='', g=null;
    if (r.c!=null && r.c>=0 && CONTACTS[r.c]) { k='c'+r.c; g=CONTACTS[r.c]; }
    else if (digits(r.adminPhone)) { k='p'+digits(r.adminPhone); g={name:r.adminName||r.adminPhone,title:'',phone:r.adminPhone}; }
    r._g=k;
    if (k && !GROUPS[k]) GROUPS[k]={ key:k, name:g.name||'', title:g.title||'', phone:g.phone||'' };
  });
  HAS_GROUPS = Object.keys(GROUPS).length>0;
  document.getElementById('seg').style.display = HAS_GROUPS ? 'grid' : 'none';
}
function grp(r){ return r._g ? GROUPS[r._g] : null; }
function setMode(m){ MODE=m; try{localStorage.setItem('SD_MODE',m);}catch(e){} render(); }
function initials(n){ var w=String(n||'').replace(/^(أ\.|م\.|د\.|ا\.)\s*/,'').trim().split(/\s+/); return (w[0]||'').charAt(0)+(w[1]?w[1].charAt(0):''); }
function km(d){ return (d<10?d.toFixed(1):Math.round(d))+t('km'); }
function navOf(r){ return hasLoc(r)?'https://www.google.com/maps/dir/?api=1&destination='+r.lat+','+r.lng:(r.mapUrl||''); }
function contactBtns(g, label){
  var ph=String(g.phone||'').replace(/[^\d+]/g,''), wa=waNum(g.phone);
  return (ph?'<a class="act call" href="tel:'+esc(ph)+'"><i class="bi bi-telephone-fill"></i>'+t('call')+'</a>':'<span class="act off"><i class="bi bi-telephone"></i>'+t('call')+'</span>')
    +(wa?'<a class="act wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent(label)+'" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>'+t('wa')+'</a>'
        :'<span class="act off"><i class="bi bi-whatsapp"></i>'+t('wa')+'</span>');
}
function details(r,i){
  return noteBar(r,i)+(r.receiving?'<div class="box rcv"><b><i class="bi bi-truck"></i> '+t('rcv')+'</b>'+esc(r.receiving)+'</div>':'')
    +(r.notes?'<div class="box note"><b><i class="bi bi-info-circle"></i> '+t('note')+'</b>'+esc(r.notes)+'</div>':'')
    +(hasLoc(r)?'<button class="copy" onclick="event.stopPropagation();copyLoc('+i+')"><i class="bi bi-clipboard"></i>'+t('copy')+'</button>'
               :'<span class="nolo"><i class="bi bi-geo"></i>'+t('noLoc')+'</span>');
}
function renderPeople(rows){
  var L=document.getElementById('list'), map={}, order=[], loose=[];
  rows.forEach(function(r,i){
    if(!r._g){ loose.push(i); return; }
    if(!map[r._g]){ map[r._g]={g:GROUPS[r._g],ix:[],d:Infinity}; order.push(r._g); }
    map[r._g].ix.push(i); if(ME&&isFinite(r._d)) map[r._g].d=Math.min(map[r._g].d,r._d);
  });
   
  order.sort(function(a,b){ var A=map[a],B=map[b];
    return ME ? A.d-B.d : (B.ix.length-A.ix.length) || A.g.name.localeCompare(B.g.name); });
  document.getElementById('count').textContent=t('countP')(order.length, rows.length);

function compress(file){
  return new Promise(function(res, rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var w=img.naturalWidth, h=img.naturalHeight; URL.revokeObjectURL(url);
      if(Math.min(w,h)<300){ rej('small'); return; }
      var sc=Math.min(1,1600/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
      var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      var q=.82, d=c.toDataURL('image/jpeg',q); while(d.length>1.6e6&&q>.45){ q-=.12; d=c.toDataURL('image/jpeg',q); }
      res(d);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej('decode'); };
    img.src=url;
  });
}

    '<div id="fErr"></div><div class="rv"><div class="rv-r"><span>'+t('nt')+'</span><b>'+poL(NOTE.po)+'</b></div>'
    +c.items.map(function(x){ var left=Math.max(0,Math.round((x.l.remaining-x.qty)*1000)/1000);
      return '<div class="rv-r"><span>'+esc(x.l.item)+'</span><b><bdi>'+fmtQ(x.qty)+' '+esc(x.l.unit)+'</bdi>'+(left>0?' <small style="color:var(--ink2);font-weight:700">('+t('rem')+' '+fmtQ(left)+')</small>':' <i class="bi bi-check-circle-fill" style="color:var(--ok)"></i>')+'</b></div>'; }).join('')
    +'</div><div class="rv"><div class="rv-r"><span>'+t('driver')+'</span><b>'+esc(FORM.driver)+'</b></div>'
    +'<div class="rv-r"><span>'+t('dphone')+'</span><b dir="ltr">'+esc(FORM.phone)+'</b></div></div>'
    +'<div class="ph-ok"><img src="'+FORM.photo+'" alt=""><div><b><i class="bi bi-check-circle-fill"></i>'+t('photoOk')+'</b></div></div>',
    '<button class="btn2" onclick="showForm()"><i class="bi bi-pencil"></i>'+t('back')+'</button>'
    +'<button class="btn1" id="sendBtn" onclick="sendDelivery()"><i class="bi bi-send-check"></i>'+t('confirm')+'</button>');
}
function sendDelivery(){
  if(FORM.busy) return; FORM.busy=true;
  var b=document.getElementById('sendBtn'); b.disabled=true; b.innerHTML='<span class="spin" style="width:18px;height:18px;margin:0;border-width:2px"></span> '+t('sending');
  try{ localStorage.setItem('SD_DRIVER',JSON.stringify({n:String(FORM.driver).trim(),p:nDig(FORM.phone)})); }catch(e){}
  api('sectorDeliver',{ref:NOTE.ref, po:NOTE.po, sub:FORM.sub, driver:String(FORM.driver).trim(), phone:nDig(FORM.phone),
       items:FORM.items.map(function(x){return {k:x.k,qty:x.qty};}), photo:{data:FORM.photo}})
    .then(function(res){
      FORM.busy=false;
      if(res&&res.ok){ done(res); return; }
      b.disabled=false; b.innerHTML='<i class="bi bi-send-check"></i>'+t('confirm');
      fErr(srvMsg(res));
      if(res&&(res.code==='stale'||res.code==='done'||res.code==='gone')){ refresh(); FORM=null; }
    }, function(){
      FORM.busy=false; b.disabled=false; b.innerHTML='<i class="bi bi-arrow-repeat"></i>'+t('retry');
      fErr(t('failed'));                                   
    });
}
function done(res){
  var full=res.state==='done';
  NOTE.lines=res.lines||NOTE.lines; NOTE.state=res.state; NOTE.pct=res.pct; FORM=null;
  ov(NOTE.site, esc(t('nt'))+' '+poL(NOTE.po),
    '<div class="done-v"><div class="ck"><i class="bi bi-check-lg"></i></div><b>'+t('okT')+'</b><p>'+(full?t('okDone'):t('okPart'))+'</p>'+stPill(res.state,res.pct)+'</div>'
    +'<div class="sum">'+sumTable(NOTE.lines)+'</div>',
    '<button class="btn1" onclick="closeOv()"><i class="bi bi-check2"></i>'+t('close')+'</button>');
  refresh();
}
 
function miniItems(items){
  return '<table class="mini">'+(items||[]).map(function(it){ return '<tr><td>'+esc(it.item)+'</td><td class="n"><bdi>'+fmtQ(it.qty)+' '+esc(it.unit)+'</bdi></td></tr>'; }).join('')+'</table>';
}
function noticesHtml(){
  var n=NOTE, h='';
  n.fix.forEach(function(f,j){
    h+='<div class="ntc red"><i class="bi bi-camera-fill"></i><div style="flex:1;min-width:0"><b>'+t('fixT')+' <bdi dir="ltr">'+esc(f.at)+'</bdi></b>'
      +(f.reason?'<span class="why">'+t('fixWhy')+esc(f.reason)+'</span>':'')
      +'<button class="btn1" onclick="showFix('+j+')"><i class="bi bi-camera"></i>'+t('fixDo')+'</button></div></div>';
  });
  n.voided.forEach(function(v){
    h+='<div class="ntc amb"><i class="bi bi-arrow-counterclockwise"></i><div style="flex:1;min-width:0"><b>'+t('voidT')+' — <bdi dir="ltr">'+esc(v.at)+'</bdi></b>'
      +(v.reason?'<span class="why">'+t('voidWhy')+esc(v.reason)+'</span>':'')+'<span>'+t('voidP')+'</span></div></div>';
  });
  return h;
}
function showFix(j){
  var f=NOTE.fix[j]; if(!f) return;
  if(!FORM||FORM.fixId!==f.id) FORM={fixId:f.id, photo:null, busy:false, po:NOTE.po};
  ov(NOTE.site, esc(t('fixDo')),
    '<div id="fErr"></div><div class="ntc red"><i class="bi bi-camera-fill"></i><div style="flex:1;min-width:0"><b>'+t('fixT')+' <bdi dir="ltr">'+esc(f.at)+'</bdi></b>'
    +(f.reason?'<span class="why">'+t('fixWhy')+esc(f.reason)+'</span>':'')+'</div></div>'
    +'<div class="sec"><i class="bi bi-camera"></i> '+t('photo')+'</div><div id="phBox"></div>'
    +'<details class="rv"><summary class="rv-r" style="cursor:pointer;list-style:none"><span>'+t('driver')+': <b>'+esc(f.driver)+'</b></span><b>'+f.items.length+' '+t('items')+' <i class="bi bi-chevron-down" style="font-size:11px"></i></b></summary>'+miniItems(f.items)+'</details>'
    +'<input type="file" id="fPhoto" accept="image/*" capture="environment" style="display:none" onchange="pickPhoto(this)">',
    '<button class="btn2" onclick="showNote()"><i class="bi bi-arrow-right-short"></i>'+t('back')+'</button>'
    +'<button class="btn1" id="sendBtn" onclick="sendFix()"><i class="bi bi-cloud-arrow-up"></i>'+t('fixSend')+'</button>');
  renderPhoto();
}
function sendFix(){
  if(!FORM||FORM.busy) return;
  if(!FORM.photo){ var p=document.getElementById('phPick'); if(p) p.classList.add('bad'); fErr(t('errPhoto')); return; }
  FORM.busy=true; var b=document.getElementById('sendBtn'); b.disabled=true;
  b.innerHTML='<span class="spin" style="width:18px;height:18px;margin:0;border-width:2px"></span> '+t('sending');
  api('sectorReupload',{ref:NOTE.ref, id:FORM.fixId, photo:{data:FORM.photo}}).then(function(res){
    FORM.busy=false;
    if(res&&res.ok){
      NOTE.fix=NOTE.fix.filter(function(x){ return x.id!==FORM.fixId; }); FORM=null;
      ov(NOTE.site, esc(t('nt'))+' '+poL(NOTE.po),
        '<div class="done-v"><div class="ck"><i class="bi bi-check-lg"></i></div><b>'+t('fixOk')+'</b><p>'+t('fixOkP')+'</p></div>',
        '<button class="btn2" onclick="showNote()"><i class="bi bi-file-earmark-text"></i>'+t('view')+'</button>'
        +'<button class="btn1" onclick="closeOv()"><i class="bi bi-check2"></i>'+t('close')+'</button>');
      refresh(); return;
    }
    b.disabled=false; b.innerHTML='<i class="bi bi-cloud-arrow-up"></i>'+t('fixSend'); fErr(srvMsg(res));
    if(res&&res.code==='gone') refresh();
  }, function(){ FORM.busy=false; b.disabled=false; b.innerHTML='<i class="bi bi-arrow-repeat"></i>'+t('retry'); fErr(t('failed')); });
}

 
function refresh(){ fetchList(function(r){ if(r&&r.ok) got(r); }); }

 
function renderMine(){
  var h=document.getElementById('hello'), m=document.getElementById('mine');
  if(!VENDOR){ h.hidden=true; m.hidden=true; return; }
  h.hidden=false; h.innerHTML='<i class="bi bi-person-check-fill"></i><span>'+esc(t('hello')(VENDOR.name))+'</span>';
  var all=[]; DATA.forEach(function(r){ (r.pos||[]).forEach(function(p){ all.push(p); }); });
  var waiting=all.filter(function(p){ return p.state!=='done'||p.fix; }).length;
  m.hidden=false;
  if(!all.length){ ONLY=false; m.innerHTML='<div class="mi"><i class="bi bi-inbox"></i></div><div class="mt"><b>'+t('mineNone')+'</b></div>'; return; }
  m.innerHTML='<div class="mi"><i class="bi bi-file-earmark-text-fill"></i></div><div class="mt"><b>'+t('mineT')(all.length)+'</b><small>'+t('mineS')(waiting)+'</small></div>'
    +'<button class="'+(ONLY?'on':'')+'" onclick="toggleOnly()"><i class="bi bi-funnel'+(ONLY?'-fill':'')+'"></i> '+(ONLY?t('allBtn'):t('onlyMine'))+'</button>';
}
function toggleOnly(){ ONLY=!ONLY; renderMine(); render(); }

applyLang(); load();
</script>
</body>
</html>
