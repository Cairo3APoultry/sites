<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairo 3A — Sites Directory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A47;--red:#C4151C;--ink:#1F2937;--ink2:#5B6676;--gray:#94A3B8;--line:#E4E9F1;--bg:#F3F5F9;--card:#FFFFFF;
  --soft:#F7F9FC;--amber:#FFF7E6;--amber-b:#F5D9A8;--amber-t:#8A5A00;--ok:#15803D;--wa:#16A34A;--font:'Cairo','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#E8EDF4;--ink2:#A9B4C6;--gray:#7E8AA0;--line:#2A3547;--bg:#0E1420;--card:#172033;
  --soft:#1C273B;--amber:#2B2416;--amber-b:#5C4A22;--amber-t:#F2C979}}
html[lang="en"]{--font:'Inter','Cairo',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}

.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-bottom:4px solid var(--red)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:40px;width:auto;display:block}
.brand .fb{font-family:Georgia,serif;font-weight:700;font-size:19px}
.lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700}
.top h1{max-width:980px;margin:14px auto 0;font-size:21px;font-weight:800;line-height:1.3}
.top p{max-width:980px;margin:4px auto 0;font-size:13px;color:#B9C6DA}

.wrap{max-width:980px;margin:0 auto;padding:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  font:inherit;font-size:15px;padding:0 42px 0 14px;outline:none}
html[dir="ltr"] .search input{padding:0 14px 0 42px}
.search input:focus{border-color:var(--red)}
.search i{position:absolute;top:50%;transform:translateY(-50%);right:14px;color:var(--gray)}
html[dir="ltr"] .search i{right:auto;left:14px}
.near{height:46px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:0 16px;display:flex;align-items:center;gap:7px}
.near.on{background:var(--red)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

#map{height:240px;border-radius:14px;margin:10px 0 4px;border:1px solid var(--line);z-index:1;background:var(--soft)}
.map-toggle{background:none;border:none;color:var(--ink2);font-size:13px;font-weight:700;padding:6px 2px}
.count{font-size:13px;color:var(--gray);margin:8px 2px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 4px 18px -12px rgba(20,30,50,.25)}
.c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.c-co{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--red);text-transform:uppercase}
.c-name{font-size:18px;font-weight:800;line-height:1.3;margin-top:2px}
.c-dist{flex-shrink:0;background:var(--soft);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px}
.act{height:46px;border-radius:11px;border:none;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.act.nav{background:var(--red);color:#fff}
.act.call{background:var(--navy);color:#fff}
.act.wa{background:var(--wa);color:#fff}
.act.off{background:var(--soft);color:var(--gray);pointer-events:none}
.box{border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.box b{display:block;font-size:11px;letter-spacing:.4px;margin-bottom:2px}
.box.rcv{background:var(--amber);border:1px solid var(--amber-b);color:var(--ink)}
.box.rcv b{color:var(--amber-t)}
.box.note{background:var(--soft);color:var(--ink)}
.box.note b{color:var(--ink2)}
.c-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2);gap:8px;flex-wrap:wrap}
.c-foot .who{display:flex;align-items:center;gap:6px;font-weight:700}
.nolo{font-size:12.5px;color:var(--gray);display:flex;align-items:center;gap:6px}
.copy{background:none;border:none;color:var(--ink2);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}

.state{text-align:center;padding:60px 20px;color:var(--ink2)}
.state i{font-size:40px;color:var(--gray);display:block;margin-bottom:10px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--card);
  padding:11px 16px;border-radius:11px;font-size:13.5px;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--gray);padding:22px 0 8px}
.leaflet-popup-content{font-family:var(--font);font-size:13px}
.leaflet-popup-content a{color:#C4151C;font-weight:800}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand" id="brand"><span class="fb">CAIRO 3A</span></div>
    <button class="lang" id="langBtn" onclick="toggleLang()">English</button>
  </div>
  <h1 data-t="title">دليل مواقع القطاعات</h1>
  <p data-t="sub">الموقع، والتواصل، وتعليمات الاستلام لكل قطاع</p>
</header>

<main class="wrap">
  <div class="tools">
    <div class="search"><i class="bi bi-search"></i><input id="q" type="search" data-tp="search" placeholder="ابحث باسم الموقع أو المسؤول" oninput="render()"></div>
    <button class="near" id="nearBtn" onclick="nearMe()"><i class="bi bi-crosshair"></i><span data-t="near">الأقرب لي</span></button>
  </div>
  <div class="chips" id="chips"></div>
  <button class="map-toggle" id="mapToggle" onclick="toggleMap()"><i class="bi bi-map"></i> <span data-t="hideMap">إخفاء الخريطة</span></button>
  <div id="map"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"><div class="state" style="grid-column:1/-1"><div class="spin"></div><span data-t="loading">جارٍ التحميل…</span></div></div>
  <div class="foot" id="foot"></div>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* المفتاح: من القالب (عند الخدمة عبر Apps Script) أو من الرابط (عند الاستضافة الخارجية) */
var KEY = '<?= key ?>';
if (!/^[A-Za-z0-9]+$/.test(KEY)) KEY = new URLSearchParams(location.search).get('k') || new URLSearchParams(location.search).get('sectors') || '';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbz_a2TbOIgZ3sZvCg94d0zIk0Byhx8gp8gsScfrytWJwkKPGQL0yz2RX546ja9cOk4OgQ/exec';   /* عند استضافة الصفحة خارج Apps Script: ضع رابط الـ Web App هنا */

var T = {
  ar: { title:'دليل مواقع القطاعات', sub:'الموقع، والتواصل، وتعليمات الاستلام لكل قطاع', search:'ابحث باسم الموقع أو المسؤول',
        near:'الأقرب لي', all:'الكل', hideMap:'إخفاء الخريطة', showMap:'إظهار الخريطة', loading:'جارٍ التحميل…',
        nav:'الاتجاهات', call:'اتصال', wa:'واتساب', rcv:'تعليمات الاستلام والتفريغ', note:'ملاحظات',
        noLoc:'لم يُحدَّد الموقع بعد', admin:'المسؤول', km:' كم', count:function(n){return n+' قطاع';},
        none:'لا توجد نتائج', invalid:'هذا الرابط غير صالح أو تم تغييره. اطلب الرابط الجديد من إدارة المشتريات.',
        failed:'تعذّر التحميل. تحقق من الاتصال وحاول مرة أخرى.', copied:'تم نسخ الموقع', copy:'نسخ الموقع',
        geoFail:'تعذّر تحديد موقعك — فعّل خدمة الموقع وحاول مرة أخرى', updated:'تحديث', lang:'English',
        waMsg:function(s){return 'مرحبًا، أنا مورد متجه إلى '+s+'.';} },
  en: { title:'Sites Directory', sub:'Location, contacts and receiving instructions for every site', search:'Search by site or contact',
        near:'Nearest to me', all:'All', hideMap:'Hide map', showMap:'Show map', loading:'Loading…',
        nav:'Directions', call:'Call', wa:'WhatsApp', rcv:'Receiving & unloading', note:'Notes',
        noLoc:'Location not set yet', admin:'Contact', km:' km', count:function(n){return n+' sites';},
        none:'No results', invalid:'This link is invalid or has been changed. Ask the purchasing team for the new link.',
        failed:'Could not load. Check your connection and try again.', copied:'Location copied', copy:'Copy location',
        geoFail:'Could not get your location — enable location services and try again', updated:'Updated', lang:'العربية',
        waMsg:function(s){return 'Hello, I am a supplier heading to '+s+'.';} }
};
var LANG = (function(){ try { return localStorage.getItem('SD_LANG') || 'ar'; } catch(e){ return 'ar'; } })();
var DATA = [], CO = '', ME = null, MAP = null, LAYER = null, MAP_ON = true;
function t(k){ return T[LANG][k]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function toast(m){ var e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('show');},2600); }

function applyLang(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(k!=='hideMap') el.textContent=t(k); });
  document.querySelectorAll('[data-tp]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-tp')); });
  document.getElementById('langBtn').textContent=t('lang');
  document.querySelector('#mapToggle span').textContent=MAP_ON?t('hideMap'):t('showMap');
}
function toggleLang(){ LANG=LANG==='ar'?'en':'ar'; try{localStorage.setItem('SD_LANG',LANG);}catch(e){} applyLang(); renderChips(); render(); }

/* رقم مصري ← صيغة دولية لواتساب */
function waNum(p){ var d=String(p||'').replace(/[^\d]/g,''); if(d.indexOf('00')===0)d=d.slice(2);
  if(d.length===11&&d[0]==='0')d='20'+d.slice(1); else if(d.length===10&&d[0]==='1')d='20'+d; return d; }
function dist(a,b,c,d){ var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;
  var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)); }
function hasLoc(r){ return r.lat!==null&&r.lng!==null&&isFinite(r.lat)&&isFinite(r.lng); }

function load(){
  if(!KEY){ fail('invalid'); return; }
  if(window.google&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(got).withFailureHandler(function(){fail('failed');}).sd_public(KEY);
  } else if(GAS_URL){
    fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'sectorDirectory',payload:{key:KEY}})})
      .then(function(r){return r.json();}).then(got).catch(function(){fail('failed');});
  } else fail('failed');
}
function got(res){
  if(!res||!res.ok){ fail('invalid'); return; }
  DATA=res.rows||[];
  if(res.brand&&res.brand.logo) document.getElementById('brand').innerHTML='<img src="'+res.brand.logo+'" alt="Cairo 3A">';
  document.getElementById('foot').textContent='Cairo 3A Poultry';
  renderChips(); render(); initMap();
}
function fail(k){
  document.getElementById('list').innerHTML='<div class="state" style="grid-column:1/-1"><i class="bi bi-'+(k==='invalid'?'shield-lock':'wifi-off')+'"></i>'+esc(t(k))+'</div>';
  document.getElementById('map').style.display='none'; document.getElementById('mapToggle').style.display='none';
}

function renderChips(){
  var el=document.getElementById('chips'); el.innerHTML=''; return;   /* الشركات لا تظهر للموردين */
  var cos=[];
  el.innerHTML=[''].concat(cos).map(function(c){
    /* الاسم في data-c — لا داخل نص JavaScript (المتصفح يفك ترميز HTML قبل التنفيذ) */
    return '<button class="chip'+(c===CO?' on':'')+'" data-c="'+esc(c)+'" onclick="setCo(this.getAttribute(\'data-c\'))">'+esc(c||t('all'))+'</button>';
  }).join('');
}
function setCo(c){ CO=c; renderChips(); render(); }

function view(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var rows=DATA.filter(function(r){
    return !q||((r.name||'')+' '+(r.adminName||'')).toLowerCase().indexOf(q)>=0;
  });
  if(ME) rows=rows.map(function(r){ r._d=hasLoc(r)?dist(ME.lat,ME.lng,r.lat,r.lng):Infinity; return r; })
                  .sort(function(a,b){ return a._d-b._d; });
  return rows;
}
function render(){
  var rows=view(), L=document.getElementById('list');
  document.getElementById('count').textContent=t('count')(rows.length);
  if(!rows.length){ L.innerHTML='<div class="state" style="grid-column:1/-1"><i class="bi bi-search"></i>'+t('none')+'</div>'; drawMarkers(rows); return; }
  L.innerHTML=rows.map(function(r,i){
    var loc=hasLoc(r), dest=loc?(r.lat+','+r.lng):'';
    var navUrl=loc?'https://www.google.com/maps/dir/?api=1&destination='+dest:(r.mapUrl||'');
    var ph=String(r.adminPhone||'').replace(/[^\d+]/g,''), wa=waNum(r.adminPhone);
    var label=r.name;
    return '<article class="card">'
      +'<div class="c-head"><div class="c-name">'+esc(r.name)+'</div>'
      +(ME&&isFinite(r._d)?'<span class="c-dist"><i class="bi bi-geo-alt"></i> '+(r._d<10?r._d.toFixed(1):Math.round(r._d))+t('km')+'</span>':'')+'</div>'
      +'<div class="acts">'
      +(navUrl?'<a class="act nav" href="'+esc(navUrl)+'" target="_blank" rel="noopener"><i class="bi bi-sign-turn-right-fill"></i>'+t('nav')+'</a>'
              :'<span class="act off"><i class="bi bi-geo"></i>'+t('nav')+'</span>')
      +(ph?'<a class="act call" href="tel:'+esc(ph)+'"><i class="bi bi-telephone-fill"></i>'+t('call')+'</a>':'<span class="act off"><i class="bi bi-telephone"></i>'+t('call')+'</span>')
      +(wa?'<a class="act wa" href="https://wa.me/'+wa+'?text='+encodeURIComponent(t('waMsg')(label))+'" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>'+t('wa')+'</a>'
          :'<span class="act off"><i class="bi bi-whatsapp"></i>'+t('wa')+'</span>')
      +'</div>'
      +(r.receiving?'<div class="box rcv"><b><i class="bi bi-truck"></i> '+t('rcv')+'</b>'+esc(r.receiving)+'</div>':'')
      +(r.notes?'<div class="box note"><b><i class="bi bi-info-circle"></i> '+t('note')+'</b>'+esc(r.notes)+'</div>':'')
      +'<div class="c-foot">'
      +(r.adminName?'<span class="who"><i class="bi bi-person-badge"></i>'+t('admin')+': '+esc(r.adminName)+'</span>':'<span></span>')
      +(loc?'<button class="copy" onclick="copyLoc('+i+')"><i class="bi bi-clipboard"></i>'+t('copy')+'</button>'
           :'<span class="nolo"><i class="bi bi-geo"></i>'+t('noLoc')+'</span>')
      +'</div></article>';
  }).join('');
  window._ROWS=rows; drawMarkers(rows);
}
function copyLoc(i){
  var r=window._ROWS[i], s='https://www.google.com/maps?q='+r.lat+','+r.lng;
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast(t('copied'));})
    .catch(function(){ var a=document.createElement('textarea'); a.value=s; document.body.appendChild(a); a.select();
      try{document.execCommand('copy'); toast(t('copied'));}catch(e){} a.remove(); });
}

/* الخريطة — Leaflet + OpenStreetMap (بلا مفاتيح API) */
function initMap(){
  if(!window.L){ document.getElementById('map').style.display='none'; document.getElementById('mapToggle').style.display='none'; return; }
  if(!DATA.some(hasLoc)){ document.getElementById('map').style.display='none'; document.getElementById('mapToggle').style.display='none'; return; }
  MAP=L.map('map',{scrollWheelZoom:false,attributionControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP);
  LAYER=L.layerGroup().addTo(MAP); drawMarkers(view());
}
function drawMarkers(rows){
  if(!MAP||!LAYER) return;
  LAYER.clearLayers(); var pts=[];
  rows.filter(hasLoc).forEach(function(r){
    var m=L.circleMarker([r.lat,r.lng],{radius:9,color:'#fff',weight:2,fillColor:'#C4151C',fillOpacity:1}).addTo(LAYER);
    m.bindPopup('<b>'+esc(r.name)+'</b><br><a href="https://www.google.com/maps/dir/?api=1&destination='+r.lat+','+r.lng+'" target="_blank">'+t('nav')+' ›</a>');
    pts.push([r.lat,r.lng]);
  });
  if(ME){ L.circleMarker([ME.lat,ME.lng],{radius:8,color:'#fff',weight:2,fillColor:'#2563EB',fillOpacity:1}).addTo(LAYER); pts.push([ME.lat,ME.lng]); }
  if(pts.length===1) MAP.setView(pts[0],13); else if(pts.length) MAP.fitBounds(pts,{padding:[26,26],maxZoom:13});
}
function toggleMap(){ MAP_ON=!MAP_ON; document.getElementById('map').style.display=MAP_ON?'block':'none';
  document.querySelector('#mapToggle span').textContent=MAP_ON?t('hideMap'):t('showMap'); if(MAP_ON&&MAP) setTimeout(function(){MAP.invalidateSize();},50); }

function nearMe(){
  if(!navigator.geolocation){ toast(t('geoFail')); return; }
  var b=document.getElementById('nearBtn'); b.disabled=true;
  navigator.geolocation.getCurrentPosition(function(p){
    b.disabled=false; ME={lat:p.coords.latitude,lng:p.coords.longitude}; b.classList.add('on'); render();
  },function(){ b.disabled=false; toast(t('geoFail')); },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

applyLang(); load();
</script>
</body>
</html>
